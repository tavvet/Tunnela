name: Windows build

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test and package (Windows x64)
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: powershell
    env:
      CI: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bootstrap pinned project-local SDK
        run: .\scripts\bootstrap-sdk.ps1
      - name: Build, run isolated tests and compile unsigned installer
        run: .\scripts\build-installer.ps1 -TestResultsDirectory "$env:GITHUB_WORKSPACE\.artifacts\test-results"
      - name: Upload test reports even after a failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: .artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 14
      - name: Upload unsigned installer and verification metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Tunnela-win-x64-${{ github.sha }}
          path: |
            .artifacts/installer/*-Setup-x64.exe
            .artifacts/installer/*-Setup-x64.exe.sha256
            .artifacts/installer/*-Setup-x64.exe.build.json
          if-no-files-found: error
          retention-days: 14
